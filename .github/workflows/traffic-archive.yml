name: 360° Repository Traffic & Telemetry Archival

on:
  schedule:
    # Run automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches:
      - main
    paths:
      - '.github/workflows/traffic-archive.yml'
      - 'scripts/archive_traffic.py'

permissions:
  contents: write

jobs:
  archive-traffic:
    name: Snapshot & Merge Telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute 360° Traffic Archiver
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/archive_traffic.py

      - name: Commit and Push Historical Telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): snapshot and archive daily repository traffic [skip ci]" && git push)
