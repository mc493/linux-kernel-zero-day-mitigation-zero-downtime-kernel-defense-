# Falco Helm Values: Supply-Chain & IDE Extension Persistence Defense
# Targets: Trojanized IDE Extensions, Rogue Package Hooks, and SSH Persistence Backdoors

driver:
  kind: auto
  type: modern_ebpf

falco:
  # Linux 7.0 ABI Invariant:
  # modern_ebpf on modern kernels must exclude openat and clone3 from custom syscall sets
  # to prevent register-clobbering and parameter parsing panics
  base_syscalls:
    custom_set: ['!openat', '!clone3']

customRules:
  rules-ssh-defense.yaml: |-
    - rule: Detect Modification of SSH Authorized Keys or Credentials
      desc: Detects unauthorized writes, appends, or modifications to authorized_keys or identity keys by any process (mitigates trojanized IDE extensions, rogue build hooks, and container escapes)
      condition: >
        (open_write and (user_ssh_directory or fd.name startswith /root/.ssh or fd.name contains "/.ssh/")
         and (fd.name contains "authorized_keys" or fd.name contains "id_rsa" or fd.name contains "id_ed25519" or fd.name contains "id_ecdsa"))
        or
        (spawned_process and (proc.cmdline contains "authorized_keys" or proc.cmdline contains ".ssh/id_")
         and not proc.name in (ssh-keygen, ssh-copy-id, sshd, ssh, scp, sftp, sshpass, rsync))
      output: "CRITICAL: Unauthorized write or modification to SSH keys or credentials (file=%fd.name evt=%evt.type proc=%proc.name cmdline=%proc.cmdline pproc=%proc.pname user=%user.name uid=%user.uid container=%container.name id=%container.id)"
      priority: CRITICAL
      tags: [security, host, container, ssh, persistence, supply_chain, mitre_persistence, T1098.004]

    - rule: Detect Interactive Reverse Shell Execution
      desc: Detects interactive reverse shell commands spawned with network redirection (such as bash interactive network redirection or netcat execution)
      condition: >
        spawned_process
        and proc.name in (bash, sh, zsh, dash)
        and not (proc.cmdline contains "truncation"
                 or proc.cmdline contains "kubectl "
                 or proc.cmdline contains "helm "
                 or proc.cmdline contains "git "
                 or proc.cmdline contains "cat <<"
                 or proc.cmdline contains "grep "
                 or proc.pname in (make, gcc, dkms, dpkg, apt, kubectl, helm, git, python, python3))
        and (
             ((proc.cmdline contains "-i" or proc.cmdline contains " -i ") and (proc.cmdline contains "/dev/tcp/" or proc.cmdline contains "/dev/udp/"))
             or
             ((proc.cmdline glob "*nc *" or proc.cmdline glob "*ncat*" or proc.cmdline glob "nc *" or proc.cmdline glob "ncat *")
              and (proc.cmdline contains " -e " or proc.cmdline contains " -e/" or proc.cmdline contains " -c " or proc.cmdline contains " --exec " or proc.cmdline contains " --sh-exec "))
            )
      output: "CRITICAL: Interactive reverse shell attempt detected (proc=%proc.name cmdline=%proc.cmdline pproc=%proc.pname user=%user.name container=%container.name id=%container.id)"
      priority: CRITICAL
      tags: [security, host, container, reverse_shell, mitre_execution]

falcosidekick:
  enabled: true
  config:
    webhook:
      address: "http://127.0.0.1:9876/falco-alert"
      minimumpriority: "warning"
