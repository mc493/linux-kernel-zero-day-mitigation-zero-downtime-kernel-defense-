apiVersion: v1
kind: Pod
metadata:
  name: hardened-app-workload
  labels:
    app.kubernetes.io/name: hardened-app
spec:
  # Enforce User Namespaces: container UID 0 is remapped to unprivileged host UID > 165536
  # Works with Kubernetes CRI v1.30+ and containerd v2.2+ default runtime handler.
  # If your cluster uses a dedicated RuntimeClass name for userns, uncomment:
  # runtimeClassName: runc
  hostUsers: false
  securityContext:
    # Synchronous SECCOMP profile enforcing AF_ALG & kTLS blockage
    # Staged on nodes at: /var/lib/kubelet/seccomp/profiles/seccomp-kernel-cve-mitigation.json
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/seccomp-kernel-cve-mitigation.json
  containers:
  - name: app
    # Pin immutable release image by cryptographic digest (guarantees provenance & immutability)
    image: alpine:3.20.3@sha256:1e42bbe2508154c9126d48c2b8a75420c3544343bf86fd041fb7527e017a4b4a
    command: ["sleep", "3600"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
